# ML Experiment Intelligence — Review Pipeline
#
# Triggered from Streamlit UI (Tab 1 → "Submit Review") or manually
# from GitHub → Actions → "Run workflow".
#
# Prerequisites (one-time setup):
#   1. Register your machine as a self-hosted runner:
#      GitHub repo → Settings → Actions → Runners → "New self-hosted runner"
#      Follow the instructions for macOS. The runner reaches localhost directly.
#
#   2. Make sure FastAPI is running before triggering this workflow:
#      uvicorn api.main:app --port 8000 --reload
#
#   3. Set these in GitHub repo → Settings → Variables (not Secrets):
#      API_BASE_URL = http://localhost:8000   (or your ngrok URL)
#
#   4. Optionally set in Secrets:
#      PIPELINE_KEY = your-pipeline-key

name: ML Experiment Review

on:
  workflow_dispatch:
    inputs:
      review_id:
        description: "Review ID (pre-generated by Streamlit — do not change)"
        required: true
        type: string
      experiment_id:
        description: "Experiment ID (e.g. EXP-021)"
        required: true
        type: string
      model_name:
        description: "Model name (e.g. churn_xgb_v4)"
        required: true
        type: string
      algorithm:
        description: "Algorithm (e.g. XGBoost, LogisticRegression)"
        required: true
        type: string
      task:
        description: "Task type"
        required: true
        type: choice
        options:
          - binary_classification
          - regression
          - multi_class_classification
          - ranking
          - time_series
          - anomaly_detection
          - survival_analysis
          - uplift_modelling
          - reinforcement_learning
          - embedding
          - causal_inference
      features:
        description: "Features (comma-separated)"
        required: true
        type: string
      metrics:
        description: >
          All accuracy/AUC metrics as a JSON object, e.g.
          {"train_acc":0.85,"val_acc":0.88,"test_acc":0.87,"roc_auc":0.92}
        required: true
        type: string
      dataset_sizes:
        description: >
          Train/test row counts as a JSON object, e.g.
          {"train_size":10000,"test_size":2000}
        required: true
        type: string
      leakage_risk:
        description: "Self-reported leakage risk"
        required: false
        default: "none"
        type: choice
        options: [none, low, medium, high]
      bias_flags:
        description: "Bias flags (comma-separated, leave blank if none)"
        required: false
        default: ""
        type: string

jobs:
  ml-review:
    name: Submit → Pipeline → Poll for Verdict
    runs-on: self-hosted   # ← runs on YOUR machine; localhost:8000 is reachable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python 3.11
        # actions/setup-python fails on self-hosted runners that don't have a
        # writable /Users/runner toolcache. On a self-hosted Mac we use the
        # system (or pyenv/brew) Python 3.11 that is already installed.
        run: |
          python3.11 --version || python3 --version
          which python3.11 || which python3

      - name: Install script dependencies
        run: python3.11 -m pip install requests --quiet || python3 -m pip install requests --quiet

      - name: Check FastAPI is reachable
        run: |
          echo "Checking FastAPI health at $API_BASE_URL …"
          curl -sf "$API_BASE_URL/health" \
            && echo "✅ FastAPI is up" \
            || (echo "❌ FastAPI not reachable at $API_BASE_URL — start it with: uvicorn api.main:app --port 8000" && exit 1)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:8000' }}

      - name: Submit experiment and poll for verdict
        run: |
          (python3.11 -c "import sys" 2>/dev/null && PY=python3.11) || PY=python3
          $PY scripts/cicd_submit.py \
            --review-id      "${{ inputs.review_id }}" \
            --experiment-id  "${{ inputs.experiment_id }}" \
            --model-name     "${{ inputs.model_name }}" \
            --algorithm      "${{ inputs.algorithm }}" \
            --task           "${{ inputs.task }}" \
            --features       "${{ inputs.features }}" \
            --metrics        '${{ inputs.metrics }}' \
            --dataset-sizes  '${{ inputs.dataset_sizes }}' \
            --leakage-risk   "${{ inputs.leakage_risk }}" \
            --bias-flags     "${{ inputs.bias_flags }}"
        env:
          API_BASE_URL:           ${{ vars.API_BASE_URL || 'http://localhost:8000' }}
          PIPELINE_KEY:           ${{ secrets.PIPELINE_KEY || 'dev-pipeline-key' }}
          POLL_INTERVAL_SECONDS:  "15"
          MAX_POLLS:              "80"

      - name: ✅ Deployment approved
        if: success()
        run: |
          echo "✅ Model '${{ inputs.model_name }}' approved."
          echo "   can_deploy = true  |  experiment = ${{ inputs.experiment_id }}"
          echo "   Check the Model Registry in Streamlit at http://localhost:8501"

      - name: ❌ Deployment blocked
        if: failure()
        run: |
          echo "❌ Model '${{ inputs.model_name }}' was not approved."
          echo "   can_deploy = false  |  check review findings in Streamlit Review Queue."